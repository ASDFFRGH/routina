name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          keystore="${RUNNER_TEMP}/routina-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          test -s "${keystore}"
          {
            echo "ANDROID_KEYSTORE_PATH=${keystore}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --no-daemon

      - name: Package and verify release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          apk="app/build/outputs/apk/release/app-release.apk"
          aapt="${ANDROID_HOME}/build-tools/37.0.0/aapt"
          apk_version="$(${aapt} dump badging "${apk}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          test -n "${apk_version}"
          test "${apk_version}" = "${version}"

          mkdir -p dist
          release_apk="dist/routina-${tag}.apk"
          cp "${apk}" "${release_apk}"
          (
            cd dist
            sha256sum "$(basename "${release_apk}")" > "$(basename "${release_apk}").sha256"
          )

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: routina-release-apk
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: routina-release-apk
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          apk="dist/routina-${TAG}.apk"
          checksum="${apk}.sha256"
          test -f "${apk}"
          test -f "${checksum}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" = "true" ]]; then
              echo "Refusing to replace assets on a draft release: ${TAG}" >&2
              exit 1
            fi
            gh release upload "${TAG}" "${apk}" "${checksum}" --clobber
          else
            gh release create "${TAG}" "${apk}" "${checksum}" \
              --verify-tag \
              --title "Routina ${TAG}" \
              --notes "Official signed release APK. Install the APK and follow Android's update confirmation when prompted."
          fi
