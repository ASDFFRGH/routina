name: Release debug APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools platforms;android-37 build-tools;37.0.0

      - name: Test, lint, and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Package and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          aapt="${ANDROID_HOME}/build-tools/37.0.0/aapt"
          apk_version="$(${aapt} dump badging "${apk}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          test -n "${apk_version}"
          test "${apk_version}" = "${version}"

          mkdir -p dist
          release_apk="dist/routina-${tag}-debug.apk"
          cp "${apk}" "${release_apk}"
          (
            cd dist
            sha256sum "$(basename "${release_apk}")" > "$(basename "${release_apk}").sha256"
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: routina-debug-apk
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: routina-debug-apk
          path: dist

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          apk="dist/routina-${TAG}-debug.apk"
          checksum="${apk}.sha256"
          test -f "${apk}"
          test -f "${checksum}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            release_state="$(gh release view "${TAG}" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
            if [[ "${release_state}" != $'false\ttrue' ]]; then
              echo "Refusing to replace assets on a draft or non-prerelease release: ${TAG}" >&2
              exit 1
            fi
            gh release upload "${TAG}" "${apk}" "${checksum}" --clobber
          else
            gh release create "${TAG}" "${apk}" "${checksum}" \
              --verify-tag \
              --prerelease \
              --title "Routina ${TAG}" \
              --notes "Debug-signed preview APK. This build is intended for testing and is not a production-signed release."
          fi
